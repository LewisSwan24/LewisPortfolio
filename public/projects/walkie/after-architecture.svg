<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs><style>
  :where(:root) {
    --svg-ground: #F6F4EF;
    --svg-surface: #FCFBF8;
    --svg-card: #ECE8DF;
    --svg-warn: #FBEFE9;
    --svg-ink: #151412;
    --svg-muted: #3E3A33;
    --svg-subtle: #4E4940;
    --svg-border: #6E675C;
    --svg-hairline: #D6CDBC;
    --svg-accent: #A63F2A;
    --svg-navy: #2B4D6F;
    --svg-green: #2F5939;
    --svg-amber: #9A6B26;
    --svg-pill-bg: #161412;
    --svg-pill-fg: #F7F4EC;
  }
  @media (prefers-color-scheme: dark) {
    :where(:root) {
      --svg-ground: #141413;
      --svg-surface: #181816;
      --svg-card: #222220;
      --svg-warn: #291D1A;
      --svg-ink: #EFECE6;
      --svg-muted: #C2BDB2;
      --svg-subtle: #9E988D;
      --svg-border: #524F48;
      --svg-hairline: #33312C;
      --svg-accent: #E27A63;
      --svg-navy: #7FA7D1;
      --svg-green: #72B382;
      --svg-amber: #E0A952;
      --svg-pill-bg: #EFECE6;
      --svg-pill-fg: #141413;
    }
  }
</style></defs>
  <rect width="800" height="500" fill="var(--svg-surface)"/>
  <rect x="28" y="28" width="744" height="444" rx="10" fill="var(--svg-ground)" stroke="var(--svg-ink)" stroke-width="2"/>
  <text x="56" y="70" fill="var(--svg-ink)" font-family="monospace" font-size="15" font-weight="700">AFTER: PHYSICAL WRIST KEY GRAMMAR + SEALED RELAY</text>
  <rect x="56" y="106" width="210" height="236" rx="8" fill="var(--svg-surface)" stroke="var(--svg-ink)" stroke-width="1.5"/>
  <text x="74" y="138" fill="var(--svg-ink)" font-family="monospace" font-size="13" font-weight="700">M5StickS3 Watch</text>
  <text x="74" y="172" fill="var(--svg-muted)" font-family="sans-serif" font-size="13">Hold Front: Record 16kHz</text>
  <text x="74" y="204" fill="var(--svg-green)" font-family="sans-serif" font-size="13" font-weight="700">Press Front: APPROVE</text>
  <text x="74" y="236" fill="var(--svg-accent)" font-family="sans-serif" font-size="13" font-weight="700">Press Side: DENY / page</text>
  <text x="74" y="274" fill="var(--svg-subtle)" font-family="monospace" font-size="11">Front key accepts pairing</text>

  <line x1="266" y1="224" x2="314" y2="224" stroke="var(--svg-accent)" stroke-width="2.5"/>
  <rect x="314" y="106" width="194" height="236" rx="8" fill="var(--svg-surface)" stroke="var(--svg-ink)" stroke-width="1.5"/>
  <text x="332" y="138" fill="var(--svg-ink)" font-family="monospace" font-size="13" font-weight="700">Transport Layer</text>
  <text x="332" y="176" fill="var(--svg-muted)" font-family="sans-serif" font-size="13">1. USB Serial Preempts</text>
  <text x="332" y="208" fill="var(--svg-muted)" font-family="sans-serif" font-size="13">2. AES-256-GCM Fly Relay</text>
  <text x="332" y="248" fill="var(--svg-accent)" font-family="sans-serif" font-size="12">Offline split: No Wi-Fi /</text>
  <text x="332" y="268" fill="var(--svg-accent)" font-family="sans-serif" font-size="12">Relay down / Bridge off</text>

  <line x1="508" y1="224" x2="554" y2="224" stroke="var(--svg-ink)" stroke-width="2"/>
  <rect x="554" y="106" width="190" height="236" rx="8" fill="var(--svg-surface)" stroke="var(--svg-ink)" stroke-width="1.5"/>
  <text x="572" y="138" fill="var(--svg-ink)" font-family="monospace" font-size="13" font-weight="700">PC Bridge + Claude</text>
  <text x="572" y="176" fill="var(--svg-muted)" font-family="sans-serif" font-size="13">Tools wait for wrist key</text>
  <text x="572" y="208" fill="var(--svg-muted)" font-family="sans-serif" font-size="13">guard.py blocks -t erase</text>
  <text x="572" y="242" fill="var(--svg-muted)" font-family="sans-serif" font-size="13">Short spoken summary back</text>

  <rect x="56" y="366" width="688" height="74" rx="6" fill="var(--svg-card)" stroke="var(--svg-border)"/>
  <text x="78" y="408" fill="var(--svg-ink)" font-family="sans-serif" font-size="13.5">Result: speech carries the request, while Claude Code's tool approvals wait for a deliberate wrist key press.</text>
</svg>
