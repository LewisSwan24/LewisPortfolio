<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Walkie M5StickS3 Asymmetric Physical Key Grammar and Three-State Offline Diagnostics">
  <rect width="800" height="500" fill="#F6F4EF" />
  <rect x="28" y="28" width="744" height="444" rx="12" fill="#FCFBF8" stroke="#6E675C" stroke-width="1.5" />
  <text x="52" y="68" fill="#151412" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700">
    WALKIE · M5STICKS3 ASYMMETRIC BUTTON GRAMMAR &amp; EXPLICIT OFFLINE STATES
  </text>

  <!-- Hardware key cards -->
  <rect x="52" y="96" width="220" height="175" rx="8" fill="#ECE8DF" stroke="#A63F2A" stroke-width="2" />
  <text x="68" y="126" fill="#A63F2A" font-family="ui-monospace, monospace" font-size="12" font-weight="700">FRONT KEY (PTT / YES)</text>
  <text x="68" y="156" fill="#151412" font-family="system-ui, sans-serif" font-size="13">Hold: Sample 16 kHz audio</text>
  <text x="68" y="182" fill="#151412" font-family="system-ui, sans-serif" font-size="13">Press: Approve pending tool</text>
  <text x="68" y="208" fill="#3E3A33" font-family="system-ui, sans-serif" font-size="12">30s hold window writes pair.key</text>
  <text x="68" y="246" fill="#A63F2A" font-family="ui-monospace, monospace" font-size="11">Requires thumb intent</text>

  <rect x="290" y="96" width="220" height="175" rx="8" fill="#ECE8DF" stroke="#3E3A33" stroke-width="1.5" />
  <text x="306" y="126" fill="#151412" font-family="ui-monospace, monospace" font-size="12" font-weight="700">SIDE KEY (DENY / CYCLE)</text>
  <text x="306" y="156" fill="#151412" font-family="system-ui, sans-serif" font-size="13">Press: Reject pending tool call</text>
  <text x="306" y="182" fill="#151412" font-family="system-ui, sans-serif" font-size="13">Hold after deny: Spoken reason</text>
  <text x="306" y="208" fill="#3E3A33" font-family="system-ui, sans-serif" font-size="12">Page long tool names across cards</text>
  <text x="306" y="246" fill="#3E3A33" font-family="ui-monospace, monospace" font-size="11">Safe interrupt · zero bash exec</text>

  <rect x="528" y="96" width="220" height="175" rx="8" fill="#ECE8DF" stroke="#2B4D6F" stroke-width="1.5" />
  <text x="544" y="126" fill="#2B4D6F" font-family="ui-monospace, monospace" font-size="12" font-weight="700">DUAL-HOLD (3 SECONDS)</text>
  <text x="544" y="156" fill="#151412" font-family="system-ui, sans-serif" font-size="13">Switch ESP32 OTA slot:</text>
  <text x="544" y="182" fill="#151412" font-family="ui-monospace, monospace" font-size="12">app1 (Walkie) &lt;-&gt; app0 (OTB)</text>
  <text x="544" y="208" fill="#3E3A33" font-family="system-ui, sans-serif" font-size="12">guard.py blocks -t erase / uploadfs</text>
  <text x="544" y="246" fill="#2B4D6F" font-family="ui-monospace, monospace" font-size="11">Sibling app preserved</text>

  <!-- 3 Explicit Offline Diagnostic Screens -->
  <text x="52" y="314" fill="#3E3A33" font-family="ui-monospace, monospace" font-size="12" font-weight="700">
    EXPLICIT THREE-WAY OFFLINE DIAGNOSTICS (REPLACES GENERIC "DISCONNECTED")
  </text>
  <rect x="52" y="330" width="220" height="114" rx="8" fill="#F6F4EF" stroke="#6E675C" />
  <text x="68" y="360" fill="#A63F2A" font-family="ui-monospace, monospace" font-size="13" font-weight="700">1. NO WI-FI</text>
  <text x="68" y="388" fill="#3E3A33" font-family="system-ui, sans-serif" font-size="12">Watch radio lost AP link.</text>
  <text x="68" y="410" fill="#3E3A33" font-family="system-ui, sans-serif" font-size="12">Fix: plug USB cable (preempts).</text>

  <rect x="290" y="330" width="220" height="114" rx="8" fill="#F6F4EF" stroke="#6E675C" />
  <text x="306" y="360" fill="#A63F2A" font-family="ui-monospace, monospace" font-size="13" font-weight="700">2. RELAY UNREACHABLE</text>
  <text x="306" y="388" fill="#3E3A33" font-family="system-ui, sans-serif" font-size="12">Wi-Fi up; Fly.io TLS ping fails.</text>
  <text x="306" y="410" fill="#3E3A33" font-family="system-ui, sans-serif" font-size="12">ISRG Root X1/X2 pinned local.</text>

  <rect x="528" y="330" width="220" height="114" rx="8" fill="#F6F4EF" stroke="#6E675C" />
  <text x="544" y="360" fill="#A63F2A" font-family="ui-monospace, monospace" font-size="13" font-weight="700">3. PC BRIDGE OFFLINE</text>
  <text x="544" y="388" fill="#3E3A33" font-family="system-ui, sans-serif" font-size="12">Relay online, laptop daemon idle.</text>
  <text x="544" y="410" fill="#3E3A33" font-family="system-ui, sans-serif" font-size="12">Check workstation sleep state.</text>
</svg>
