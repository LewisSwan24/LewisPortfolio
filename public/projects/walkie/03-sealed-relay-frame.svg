<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Walkie Sealed Transport and Host g++ Protocol Verification Gates">
  <defs><style>
  :where(:root) {
    --svg-ground: #F6F4EF;
    --svg-surface: #FCFBF8;
    --svg-card: #ECE8DF;
    --svg-warn: #FBEFE9;
    --svg-ink: #151412;
    --svg-muted: #3E3A33;
    --svg-subtle: #4E4940;
    --svg-border: #6E675C;
    --svg-hairline: #D6CDBC;
    --svg-accent: #A63F2A;
    --svg-navy: #2B4D6F;
    --svg-green: #2F5939;
    --svg-amber: #9A6B26;
    --svg-pill-bg: #161412;
    --svg-pill-fg: #F7F4EC;
  }
  @media (prefers-color-scheme: dark) {
    :where(:root) {
      --svg-ground: #141413;
      --svg-surface: #181816;
      --svg-card: #222220;
      --svg-warn: #291D1A;
      --svg-ink: #EFECE6;
      --svg-muted: #C2BDB2;
      --svg-subtle: #9E988D;
      --svg-border: #524F48;
      --svg-hairline: #33312C;
      --svg-accent: #E27A63;
      --svg-navy: #7FA7D1;
      --svg-green: #72B382;
      --svg-amber: #E0A952;
      --svg-pill-bg: #EFECE6;
      --svg-pill-fg: #141413;
    }
  }
</style></defs>
  <rect width="800" height="500" fill="var(--svg-ground)" />
  <rect x="28" y="28" width="744" height="444" rx="12" fill="var(--svg-surface)" stroke="var(--svg-border)" stroke-width="1.5" />
  <text x="52" y="68" fill="var(--svg-ink)" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14" font-weight="700">
    ZERO-KNOWLEDGE FLY.IO RELAY &amp; REPRODUCIBLE VERIFICATION GATES
  </text>

  <!-- Wire packet diagram -->
  <rect x="52" y="96" width="696" height="156" rx="8" fill="var(--svg-card)" stroke="var(--svg-border)" stroke-width="1.5" />
  <text x="72" y="124" fill="var(--svg-muted)" font-family="ui-monospace, monospace" font-size="12" font-weight="700">
    SEALED FRAME ENVELOPE (AFTER HELLO + 30S PHYSICAL PAIR)
  </text>
  <rect x="72" y="142" width="150" height="84" rx="6" fill="var(--svg-surface)" stroke="var(--svg-navy)" />
  <text x="86" y="172" fill="var(--svg-navy)" font-family="ui-monospace, monospace" font-size="12" font-weight="700">USB PCM (Primary)</text>
  <text x="86" y="198" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="12">16 kHz raw audio</text>
  <text x="86" y="216" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="11">Preempts wireless</text>

  <rect x="242" y="142" width="236" height="84" rx="6" fill="var(--svg-surface)" stroke="var(--svg-accent)" stroke-width="2" />
  <text x="258" y="172" fill="var(--svg-accent)" font-family="ui-monospace, monospace" font-size="12" font-weight="700">AES-256-GCM SEALED</text>
  <text x="258" y="198" fill="var(--svg-ink)" font-family="ui-monospace, monospace" font-size="11.5">HKDF(pair.key) + 12B nonce + Tag</text>
  <text x="258" y="216" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="11">Fly.io relay routes blind bytes</text>

  <rect x="498" y="142" width="230" height="84" rx="6" fill="var(--svg-surface)" stroke="var(--svg-muted)" />
  <text x="514" y="172" fill="var(--svg-ink)" font-family="ui-monospace, monospace" font-size="12" font-weight="700">4-bit ADPCM (--codec)</text>
  <text x="514" y="198" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="12">4x smaller Wi-Fi payload</text>
  <text x="514" y="216" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="11">Secrets in %APPDATA%\walkie</text>

  <!-- 3 Gates -->
  <text x="52" y="294" fill="var(--svg-muted)" font-family="ui-monospace, monospace" font-size="12" font-weight="700">
    AUTOMATED TEST &amp; HARDWARE SIGN-OFF GATES (NO LIVE MODEL KEY NEEDED FOR CI)
  </text>
  <rect x="52" y="312" width="220" height="132" rx="8" fill="var(--svg-ground)" stroke="var(--svg-border)" />
  <text x="68" y="342" fill="var(--svg-ink)" font-family="ui-monospace, monospace" font-size="13" font-weight="700">1. host g++ / npm test</text>
  <text x="68" y="370" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="12">Compiles lib/proto &amp; lib/ui</text>
  <text x="68" y="392" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="12">Uses fake-claude.js mock</text>
  <text x="68" y="424" fill="var(--svg-accent)" font-family="ui-monospace, monospace" font-size="11">Bridge, tools, firmware tests</text>

  <rect x="290" y="312" width="220" height="132" rx="8" fill="var(--svg-ground)" stroke="var(--svg-border)" />
  <text x="306" y="342" fill="var(--svg-ink)" font-family="ui-monospace, monospace" font-size="13" font-weight="700">2. gate-h + gate-p5</text>
  <text x="306" y="370" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="12">11 screen &amp; key scenes on S3</text>
  <text x="306" y="392" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="12">On-chip HKDF/GCM &amp; ADPCM</text>
  <text x="306" y="424" fill="var(--svg-accent)" font-family="ui-monospace, monospace" font-size="11">Manual scripts, not CI</text>

  <rect x="528" y="312" width="220" height="132" rx="8" fill="var(--svg-ground)" stroke="var(--svg-border)" />
  <text x="544" y="342" fill="var(--svg-ink)" font-family="ui-monospace, monospace" font-size="13" font-weight="700">3. gate-l relay check</text>
  <text x="544" y="370" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="12">75s idle keep-alive check</text>
  <text x="544" y="392" fill="var(--svg-muted)" font-family="system-ui, sans-serif" font-size="12">Reconnect &amp; 2nd bridge takeover</text>
  <text x="544" y="424" fill="var(--svg-accent)" font-family="ui-monospace, monospace" font-size="11">Stand-in S3 · ISRG roots</text>
</svg>
