<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FCFBF8"/>
  <rect x="28" y="28" width="744" height="444" rx="10" fill="#F6F4EF" stroke="#151412" stroke-width="2"/>
  <text x="56" y="70" fill="#151412" font-family="monospace" font-size="15" font-weight="700">AFTER: TWO-CONTROLLER HARDWARE ISOLATION + HAPTIC CO-PLAY</text>
  <rect x="56" y="110" width="214" height="230" rx="8" fill="#FCFBF8" stroke="#151412" stroke-width="1.5"/>
  <text x="76" y="144" fill="#151412" font-family="monospace" font-size="13" font-weight="700">1. Shared Wristband</text>
  <text x="76" y="178" fill="#3E3A33" font-family="sans-serif" font-size="13">2 players per axis</text>
  <text x="76" y="208" fill="#3E3A33" font-family="sans-serif" font-size="13">Co-touch required to tilt</text>
  <text x="76" y="242" fill="#A63F2A" font-family="sans-serif" font-size="13" font-weight="700">Vibration replaces shock</text>

  <rect x="292" y="110" width="214" height="230" rx="8" fill="#FCFBF8" stroke="#151412" stroke-width="1.5"/>
  <text x="312" y="144" fill="#151412" font-family="monospace" font-size="13" font-weight="700">2. Arduino Split</text>
  <text x="312" y="178" fill="#3E3A33" font-family="sans-serif" font-size="13">IR debounce &amp; cooldown</text>
  <text x="312" y="208" fill="#3E3A33" font-family="sans-serif" font-size="13">One pass = one round tick</text>
  <text x="312" y="242" fill="#2B4D6F" font-family="sans-serif" font-size="13">SafeTouchServo isolated</text>

  <rect x="528" y="110" width="216" height="230" rx="8" fill="#FCFBF8" stroke="#151412" stroke-width="1.5"/>
  <text x="548" y="144" fill="#151412" font-family="monospace" font-size="13" font-weight="700">3. Web Serial HUD</text>
  <text x="548" y="178" fill="#3E3A33" font-family="sans-serif" font-size="13">Mirrors score + timers</text>
  <text x="548" y="208" fill="#3E3A33" font-family="sans-serif" font-size="13">Parity-tested offline demo</text>
  <text x="548" y="242" fill="#3E3A33" font-family="sans-serif" font-size="13">All 5 channels synced</text>

  <rect x="56" y="366" width="688" height="74" rx="6" fill="#ECE8DF" stroke="#6E675C"/>
  <text x="78" y="408" fill="#151412" font-family="sans-serif" font-size="13.5">Exhibited outcome: 9 groups (36 players) played physically; haptics &amp; audio cued players before the scoreboard.</text>
</svg>
