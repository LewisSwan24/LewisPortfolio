<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs><style>
  :where(:root) {
    --svg-ground: #F6F4EF;
    --svg-surface: #FCFBF8;
    --svg-card: #ECE8DF;
    --svg-warn: #FBEFE9;
    --svg-ink: #151412;
    --svg-muted: #3E3A33;
    --svg-subtle: #4E4940;
    --svg-border: #6E675C;
    --svg-hairline: #D6CDBC;
    --svg-accent: #A63F2A;
    --svg-navy: #2B4D6F;
    --svg-green: #2F5939;
    --svg-amber: #9A6B26;
    --svg-pill-bg: #161412;
    --svg-pill-fg: #F7F4EC;
  }
  @media (prefers-color-scheme: dark) {
    :where(:root) {
      --svg-ground: #141413;
      --svg-surface: #181816;
      --svg-card: #222220;
      --svg-warn: #291D1A;
      --svg-ink: #EFECE6;
      --svg-muted: #C2BDB2;
      --svg-subtle: #9E988D;
      --svg-border: #524F48;
      --svg-hairline: #33312C;
      --svg-accent: #E27A63;
      --svg-navy: #7FA7D1;
      --svg-green: #72B382;
      --svg-amber: #E0A952;
      --svg-pill-bg: #EFECE6;
      --svg-pill-fg: #141413;
    }
  }
</style></defs>
  <rect width="800" height="500" fill="var(--svg-surface)"/>
  <rect x="28" y="28" width="744" height="444" rx="10" fill="var(--svg-ground)" stroke="var(--svg-ink)" stroke-width="2"/>
  <text x="56" y="70" fill="var(--svg-ink)" font-family="monospace" font-size="15" font-weight="700">AFTER: THREE CONFIDENCE LANES + HARD BLANK RULE</text>
  <rect x="56" y="110" width="688" height="78" rx="8" fill="var(--svg-surface)" stroke="var(--svg-green)" stroke-width="2"/>
  <text x="80" y="144" fill="var(--svg-green)" font-family="monospace" font-size="13" font-weight="700">LANE 01 · DETERMINISTIC MATCH (Auto-filled)</text>
  <text x="80" y="168" fill="var(--svg-muted)" font-family="sans-serif" font-size="13">Exact schema keys (Name, Email, LinkedIn, Degree) populate instantly from local device profile.</text>

  <rect x="56" y="206" width="688" height="78" rx="8" fill="var(--svg-surface)" stroke="var(--svg-amber)" stroke-width="2"/>
  <text x="80" y="240" fill="var(--svg-amber)" font-family="monospace" font-size="13" font-weight="700">LANE 02 · AMBIGUOUS MATCH (Highlight &amp; Pause)</text>
  <text x="80" y="264" fill="var(--svg-muted)" font-family="sans-serif" font-size="13">Multiple option values trigger visual review badge requiring explicit applicant choice.</text>

  <rect x="56" y="302" width="688" height="78" rx="8" fill="var(--svg-warn)" stroke="var(--svg-accent)" stroke-width="2"/>
  <text x="80" y="336" fill="var(--svg-accent)" font-family="monospace" font-size="13" font-weight="700">LANE 03 · REFUSAL BY RULE (Mandatory Blank)</text>
  <text x="80" y="360" fill="var(--svg-ink)" font-family="sans-serif" font-size="13">Visa eligibility, salary expectations, and open essays stay blank; Submit button stays permanently locked.</text>

  <text x="56" y="428" fill="var(--svg-subtle)" font-family="monospace" font-size="12">Chrome Extension + Android App share identical confidence rules without uploading raw CV PII.</text>
</svg>
