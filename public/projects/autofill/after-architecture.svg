<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#FCFBF8"/>
  <rect x="28" y="28" width="744" height="444" rx="10" fill="#F6F4EF" stroke="#151412" stroke-width="2"/>
  <text x="56" y="70" fill="#151412" font-family="monospace" font-size="15" font-weight="700">AFTER: THREE CONFIDENCE LANES + HARD BLANK RULE</text>
  <rect x="56" y="110" width="688" height="78" rx="8" fill="#FCFBF8" stroke="#2F5939" stroke-width="2"/>
  <text x="80" y="144" fill="#2F5939" font-family="monospace" font-size="13" font-weight="700">LANE 01 · DETERMINISTIC MATCH (Auto-filled)</text>
  <text x="80" y="168" fill="#3E3A33" font-family="sans-serif" font-size="13">Exact schema keys (Name, Email, LinkedIn, Degree) populate instantly from local device profile.</text>

  <rect x="56" y="206" width="688" height="78" rx="8" fill="#FCFBF8" stroke="#9A6B26" stroke-width="2"/>
  <text x="80" y="240" fill="#9A6B26" font-family="monospace" font-size="13" font-weight="700">LANE 02 · AMBIGUOUS MATCH (Highlight &amp; Pause)</text>
  <text x="80" y="264" fill="#3E3A33" font-family="sans-serif" font-size="13">Multiple option values trigger visual review badge requiring explicit applicant choice.</text>

  <rect x="56" y="302" width="688" height="78" rx="8" fill="#FBEFE9" stroke="#A63F2A" stroke-width="2"/>
  <text x="80" y="336" fill="#A63F2A" font-family="monospace" font-size="13" font-weight="700">LANE 03 · REFUSAL BY RULE (Mandatory Blank)</text>
  <text x="80" y="360" fill="#151412" font-family="sans-serif" font-size="13">Visa eligibility, salary expectations, and open essays stay blank; Submit button stays permanently locked.</text>

  <text x="56" y="428" fill="#4E4940" font-family="monospace" font-size="12">Chrome Extension + Android App share identical confidence rules without uploading raw CV PII.</text>
</svg>
