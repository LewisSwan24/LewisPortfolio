  <rect x="770" y="215" width="70" height="18" rx="4" fill="#3b82f6" opacity="0.2"/>
  
  <rect x="875" y="185" width="105" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="890" y="200" width="40" height="6" rx="3" fill="#10b981" opacity="0.5"/>
  <rect x="890" y="215" width="70" height="18" rx="4" fill="#10b981" opacity="0.2"/>
  
  <rect x="995" y="185" width="105" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="1010" y="200" width="40" height="6" rx="3" fill="#f97316" opacity="0.5"/>
  <rect x="1010" y="215" width="70" height="18" rx="4" fill="#f97316" opacity="0.2"/>
