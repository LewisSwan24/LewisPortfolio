  <circle cx="775" cy="142" r="8" stroke="#64748b" stroke-width="1.5" fill="none" opacity="0.5"/>
  <rect x="795" y="139" width="120" height="6" rx="3" fill="#64748b" opacity="0.3"/>
  <!-- Dashboard cards row -->
  <rect x="755" y="185" width="105" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
