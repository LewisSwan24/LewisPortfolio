  <rect x="775" y="375" width="100" height="5" rx="2.5" fill="#3b82f6" opacity="0.3"/>
  
  <rect x="755" y="410" width="350" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.6"/>
