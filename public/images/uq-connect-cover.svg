  <text x="100" y="260" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">UQ Connect</text>
  <text x="100" y="315" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#60a5fa" opacity="0.9">Student Portal Information Architecture</text>
  <text x="100" y="350" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#60a5fa" opacity="0.9">Redesign</text>
