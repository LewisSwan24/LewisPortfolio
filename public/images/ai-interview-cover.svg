<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c1d"/>
      <stop offset="50%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#2d1b69"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
  </g>
  <!-- Chat bubbles -->
  <rect x="700" y="120" width="380" height="80" rx="20" fill="url(#chat)" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
  <rect x="720" y="145" width="200" height="8" rx="4" fill="#a855f7" opacity="0.4"/>
  <rect x="720" y="163" width="140" height="8" rx="4" fill="#a855f7" opacity="0.25"/>
  
  <rect x="650" y="230" width="420" height="80" rx="20" fill="url(#chat)" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
  <rect x="670" y="255" width="260" height="8" rx="4" fill="#6366f1" opacity="0.4"/>
  <rect x="670" y="273" width="180" height="8" rx="4" fill="#6366f1" opacity="0.25"/>
  
  <rect x="720" y="340" width="360" height="80" rx="20" fill="url(#chat)" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
  <rect x="740" y="365" width="220" height="8" rx="4" fill="#a855f7" opacity="0.3"/>
  <rect x="740" y="383" width="160" height="8" rx="4" fill="#a855f7" opacity="0.2"/>
  <!-- AI brain icon -->
  <g transform="translate(900, 500)" filter="url(#glow)">
    <circle r="30" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6"/>
    <circle r="12" fill="#a855f7" opacity="0.3"/>
    <line x1="-20" y1="-10" x2="-35" y2="-25" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="-10" x2="35" y2="-25" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="-25" x2="0" y2="-40" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>
    <circle cx="-35" cy="-25" r="4" fill="#a855f7" opacity="0.5"/>
    <circle cx="35" cy="-25" r="4" fill="#a855f7" opacity="0.5"/>
    <circle cx="0" cy="-40" r="4" fill="#a855f7" opacity="0.5"/>
  </g>
  <!-- Floating particles -->
  <circle cx="550" cy="100" r="3" fill="#a855f7" opacity="0.5"/>
  <circle cx="1100" cy="180" r="4" fill="#6366f1" opacity="0.4"/>
  <circle cx="620" cy="500" r="5" fill="#c084fc" opacity="0.3"/>
  <!-- Title -->
  <text x="100" y="280" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">AI Interview</text>
  <text x="100" y="340" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Assistant</text>
  <text x="100" y="385" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#c084fc" opacity="0.9">AI-Powered Interview Preparation Platform</text>
  <text x="100" y="415" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#ffffff" opacity="0.5">UX Design · AI/ML · EdTech</text>
  <rect x="100" y="440" width="180" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>
</svg>
