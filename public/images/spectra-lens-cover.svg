<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="50%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#90e0ef"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630" /><line x1="60" y1="0" x2="60" y2="630" />
    <line x1="120" y1="0" x2="120" y2="630" /><line x1="180" y1="0" x2="180" y2="630" />
    <line x1="240" y1="0" x2="240" y2="630" /><line x1="300" y1="0" x2="300" y2="630" />
    <line x1="0" y1="0" x2="1200" y2="0" /><line x1="0" y1="63" x2="1200" y2="63" />
    <line x1="0" y1="126" x2="1200" y2="126" /><line x1="0" y1="189" x2="1200" y2="189" />
  </g>
  <!-- Lens circle -->
  <circle cx="770" cy="315" r="180" stroke="url(#lens)" stroke-width="6" fill="none" opacity="0.8" filter="url(#glow)"/>
  <circle cx="770" cy="315" r="140" stroke="url(#lens)" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="770" cy="315" r="100" stroke="url(#lens)" stroke-width="1.5" fill="none" opacity="0.3"/>
  <!-- Spectrum bars inside lens -->
  <rect x="710" y="260" width="20" height="110" rx="10" fill="#ff6b6b" opacity="0.8"/>
  <rect x="740" y="240" width="20" height="150" rx="10" fill="#ffa500" opacity="0.8"/>
  <rect x="770" y="230" width="20" height="170" rx="10" fill="#ffd700" opacity="0.8"/>
  <rect x="800" y="250" width="20" height="130" rx="10" fill="#4ade80" opacity="0.8"/>
  <rect x="830" y="270" width="20" height="90" rx="10" fill="#60a5fa" opacity="0.8"/>
  <!-- Floating dots -->
  <circle cx="500" cy="150" r="6" fill="#e94560" opacity="0.6"/>
  <circle cx="950" cy="200" r="8" fill="#48cae4" opacity="0.5"/>
  <circle cx="1050" cy="450" r="5" fill="#ffd700" opacity="0.4"/>
  <circle cx="400" cy="480" r="7" fill="#4ade80" opacity="0.5"/>
  <!-- Eye icon -->
  <g transform="translate(770, 315)" opacity="0.15">
    <ellipse rx="50" ry="30" stroke="#fff" stroke-width="2" fill="none"/>
    <circle r="15" fill="#fff"/>
  </g>
  <!-- Title area -->
  <text x="100" y="270" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-1">Spectra Lens</text>
  <text x="100" y="320" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#90e0ef" opacity="0.9">AR-Powered Color Accessibility Tool</text>
  <text x="100" y="360" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#ffffff" opacity="0.5">UX Design · Augmented Reality · Accessibility</text>
  <!-- Bottom accent line -->
  <rect x="100" y="390" width="200" height="3" rx="1.5" fill="url(#accent)" opacity="0.8"/>
</svg>
