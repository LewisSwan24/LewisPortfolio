<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="950" cy="300" r="200" stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.1"/>
  <circle cx="950" cy="300" r="140" stroke="#8b5cf6" stroke-width="1" fill="none" opacity="0.08"/>
  <circle cx="250" cy="530" r="120" stroke="#3b82f6" stroke-width="1" fill="none" opacity="0.06"/>
  <!-- Floating dots -->
  <circle cx="800" cy="150" r="4" fill="#3b82f6" opacity="0.4"/>
  <circle cx="1100" cy="400" r="3" fill="#8b5cf6" opacity="0.3"/>
  <circle cx="400" cy="100" r="3" fill="#06b6d4" opacity="0.3"/>
  <!-- Title -->
  <text x="100" y="250" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-2">Lewis Dong</text>
  <text x="100" y="320" font-family="Inter, system-ui, sans-serif" font-size="28" fill="#94a3b8">Interaction Designer · UX Researcher</text>
  <text x="100" y="370" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#64748b">University of Queensland · Master of Interaction Design</text>
  <rect x="100" y="400" width="200" height="3" rx="1.5" fill="url(#accent)" opacity="0.7"/>
  <text x="100" y="440" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#475569">Portfolio · Case Studies · Design Process</text>
</svg>
