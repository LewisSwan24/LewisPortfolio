name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v7
        with:
          # check:claims compares blog dates with each file's first commit,
          # which a shallow clone would report as today.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Banned-claims check
        run: pnpm check:claims

      - name: Unit tests
        run: pnpm test:ci

      - name: Automation checks
        run: pnpm automation:check

      - name: Agent readiness check
        run: pnpm agent:check

      - name: Media asset budget check
        run: pnpm media:check

      - name: CSS zero-warning check
        run: pnpm css:check

      - name: Build
        run: pnpm build

      - name: Bundle budget check
        run: pnpm budget:check

  e2e:
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
