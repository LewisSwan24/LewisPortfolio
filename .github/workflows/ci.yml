name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: ["**"]

# A new push to a pull request cancels that PR's older run. Pushes to master
# always finish, so every master commit keeps a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v7
        with:
          # check:claims compares blog dates with each file's first commit,
          # which a shallow clone would report as today.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Banned-claims check
        run: pnpm check:claims

      - name: Unit tests
        # Coverage tells loc:report which files the unit tests load.
        run: pnpm test:ci --coverage

      - name: Dead-code check
        run: pnpm knip

      - name: Effective lines of code
        run: |
          pnpm loc:report --coverage coverage/coverage-final.json --out loc-report
          cat loc-report/loc-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload loc report
        uses: actions/upload-artifact@v7
        with:
          name: loc-report
          path: loc-report/
          retention-days: 90

      - name: Automation checks
        run: pnpm automation:check

      - name: Agent readiness check
        run: pnpm agent:check

      - name: Media asset budget check
        run: pnpm media:check

      - name: CSS zero-warning check
        run: pnpm css:check

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'src/**', 'content/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      - name: Bundle budget check
        run: pnpm budget:check

  # Runs beside `quality`, not after it: it builds on its own and tests the
  # production server (`next start`), which compiles nothing on demand, so
  # Playwright can run four files at once (E2E_PROD in playwright.config.ts).
  e2e:
    runs-on: ubuntu-24.04
    # A fresh runner has no image cache, so `next start` encodes every
    # `_next/image` size on first request (AVIF is slow). With four workers
    # the phone-size home and case images timed out page.goto (PR #41, run
    # one: 7 failures, all phone viewports). No test checks the optimizer;
    # next.config.js serves the originals when this is set, at build and run.
    env:
      E2E_UNOPTIMIZED_IMAGES: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('app/**', 'src/**', 'content/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build
        run: pnpm build

      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium
        env:
          E2E_PROD: "1"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
